# Netlify detects Next.js automatically and runs it with its Next.js runtime
# (pages, API routes, image optimization). This file just pins the build.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Secret scanning: NEXT_PUBLIC_* values are public by design (they ship to the browser),
  # and Next's build cache (not deployed) holds env values from the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"
